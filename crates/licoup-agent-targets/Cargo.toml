[package]
name = "licoup-agent-targets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = []
# The fixtures an out-of-crate test build reads travel behind an explicit
# feature, because `cfg(test)` is false for a dependency and a `--lib` build
# compiles no test code. This is `licoup-foundation`'s pattern.
test-support = ["licoup-foundation/test-support"]

[dependencies]
anyhow.workspace = true
# The path, IO, process, environment and user-shell primitives every scan on
# this machine stands on.
licoup-foundation = { path = "../licoup-foundation" }
# The portable client-state store the discovery cache and the target-route
# records are written through.
licoup-client-state = { path = "../licoup-client-state" }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
# The launchd autostart label reads the effective user id, and the packaged
# scan-path manifest is a TOML document.
libc.workspace = true
toml.workspace = true

[dev-dependencies]
# The scan and cache fixtures use explicit unique identifiers so a test never
# collides with another test's persisted records.
uuid.workspace = true
# The environment pinning helpers the scan fixtures read are exposed by
# `licoup-foundation` only outside production builds, so this test build
# enables them here exactly as the native host's test build does.
licoup-foundation = { path = "../licoup-foundation", features = ["test-support"] }
