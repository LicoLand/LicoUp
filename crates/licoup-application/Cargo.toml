[package]
name = "licoup-application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# Composition and session policy: the crate names the layer crates it composes
# (foundation, client state, protocol bindings, endpoint core, platform bridges,
# agent adapters) and nothing above them. The dependency-boundary test in this
# crate's tests/ enforces the direction.
[dependencies]
lico-catalog-convergence = { path = "../lico-catalog-convergence" }
licoup-agent-adapters = { path = "../licoup-agent-adapters" }
licoup-client-state = { path = "../licoup-client-state" }
licoup-endpoint-core = { path = "../licoup-endpoint-core" }
licoup-foundation = { path = "../licoup-foundation" }
licoup-platform-bridges = { path = "../licoup-platform-bridges" }
licoup-protocol-bindings = { path = "../licoup-protocol-bindings" }
anyhow.workspace = true
chacha20poly1305.workspace = true
rand_core.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
uuid.workspace = true

[build-dependencies]
licoup-state-machine-codegen = { path = "../licoup-state-machine-codegen" }
