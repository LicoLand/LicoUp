[package]
name = "licoup-agent-cursor"
version = "0.14.0"
edition = "2024"
rust-version = "1.95.0"
license = "AGPL-3.0-or-later"
repository = "https://github.com/LicoLand/LicoUp.git"
description = "Cursor adapter package: the Cursor Agent CLI turn dialect and its wire vocabulary"

# The crate is one package's program. `parser` is this Agent's vendor protocol
# below the adapter port: the strict-lf-ndjson turn dialect of the Cursor Agent
# CLI, classified exactly once, per ADR-0008. `model` and `errors` are the wire
# vocabulary that dialect reads and reports — the launch arguments, the
# capability surface, the effective settings and the closed failure vocabulary.
# `port` is the seam the host answers, `registration` is what composition
# injects into `licoup-agent-adapter-sdk`, and `replay` is the arm that drives
# the same parser from a recorded transcript.
#
# The kernel links no part of this crate's protocol. Composition names the crate
# for its registration while the extension host's binary route is completed by
# the agent-execution port; nothing here reaches back into a client crate.
[features]
default = []

[dependencies]
licoup-agent-adapter-sdk = { path = "../licoup-agent-adapter-sdk" }
serde_json.workspace = true

[[bin]]
name = "lico-agent-cursor"
path = "src/bin/lico-agent-cursor.rs"

# Test-only. The committed package artifact is validated with the host's own
# manifest, permission and client-compatibility contract instead of a second
# reading of it. Nothing here enters the package binary, which links no kernel
# crate and reads its own package documents as data.
[dev-dependencies]
licoup-extension-contracts = { path = "../licoup-extension-contracts" }
