[package]
name = "licoup-mcp"
version = "0.2.1"
edition = "2024"
rust-version = "1.95.0"
license = "AGPL-3.0-or-later"
repository = "https://github.com/LicoLand/LicoUp.git"
description = "Independent MCP process adapter for the public LicoUp CLI"

# The crate is two layers. `wire` and `server` are the service-neutral MCP
# engine: framing, initialization, tool listing and calls, with no subagent
# catalog, no spawned process and no endpoint. The `service` payload is the
# optional `org.licoland.feature.mcp` package: the five-tool subagent
# application, the stdio connector, the authenticated loopback service and its
# lifecycle. Building without the default feature yields the neutral engine
# alone, so a consumer of the engine never links the optional payload.
[features]
default = ["service"]
service = []

[dependencies]
anyhow = "1.0"
fs2 = "0.4"
licoup-foundation = { path = "../licoup-foundation" }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.10", features = ["json"] }
uuid = { version = "1.11", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
] }

[[bin]]
name = "lico-subagent-mcp"
path = "src/main.rs"
required-features = ["service"]

# Test-only. The committed package artifact is validated with the host's own
# manifest, permission and client-compatibility contract instead of a second
# reading of it. Nothing here enters the optional service binary, which links
# no kernel crate and reads its own package documents as data.
[dev-dependencies]
licoup-extension-contracts = { path = "../licoup-extension-contracts" }
