[package]
name = "licoup-mcp"
version = "0.2.1"
edition = "2024"
rust-version = "1.95.0"
license = "AGPL-3.0-or-later"
repository = "https://github.com/LicoLand/LicoUp.git"
description = "Independent MCP process adapter for the public LicoUp CLI"
# The crate names layer crates that are themselves unpublished, so it is never
# published even though the adapter binary ships with the client.
publish = false

[dependencies]
# The MCP registry, transport and approval modules reach the portable data root
# and the private-file primitives directly; they name the primitive crate rather
# than the host they were extracted from.
licoup-foundation = { path = "../licoup-foundation" }
# The integration state every provider registration reports through.
licoup-application = { path = "../licoup-application" }
anyhow = "1.0"
fs2 = "0.4"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
ureq = { version = "2.10", features = ["json"] }
url = "2.5"
uuid = { version = "1.11", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
] }

[[bin]]
name = "lico-subagent-mcp"
path = "src/main.rs"
