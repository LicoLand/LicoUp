[package]
name = "licoup-agent-kilo"
version = "0.14.0"
edition = "2024"
rust-version = "1.95.0"
license = "AGPL-3.0-or-later"
repository = "https://github.com/LicoLand/LicoUp.git"
description = "Kilo Code adapter package: the serve driver, its endpoint policy and its vendor protocol"

# The crate is one package's program. `parser` and `serve` are this Agent's
# vendor protocol below the adapter port: the OpenCode-compatible HTTP/SSE
# documents Kilo Code's `serve` endpoint answers, the byte-level readiness
# reader and the event parser that classify them once, per ADR-0008. `driver` is
# the Agent's own half of one turn — launch configuration, request shaping,
# result projection and the capability probe. `policy` is the endpoint contract
# the Agent owns. `port` is the seam the host answers, `registration` is what
# composition injects into `licoup-agent-adapter-sdk`, and `replay` is the arm
# that drives the same parser from a recorded transcript.
#
# The kernel links no part of this crate's protocol. Composition names the crate
# for its registration while the extension host's binary route is completed by
# the agent-execution port; nothing here reaches back into a client crate.
[features]
default = []

[dependencies]
licoup-agent-adapter-sdk = { path = "../licoup-agent-adapter-sdk" }
serde_json.workspace = true
uuid.workspace = true

[[bin]]
name = "lico-agent-kilo"
path = "src/bin/lico-agent-kilo.rs"

# Test-only. The committed package artifact is validated with the host's own
# manifest, permission and client-compatibility contract instead of a second
# reading of it. Nothing here enters the package binary, which links no kernel
# crate and reads its own package documents as data.
[dev-dependencies]
licoup-extension-contracts = { path = "../licoup-extension-contracts" }
