[package]
name = "licoup-migrate"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
license = "AGPL-3.0-or-later"
repository = "https://github.com/LicoLand/LicoUp.git"
description = "Standalone migration tool for LicoUp local data"

[[bin]]
name = "licoup-migrate"
path = "src/main.rs"

[lib]
name = "licoup_migrate"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
licoup-native = { path = "../licoup-native" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
rusqlite.workspace = true
serde_json = "1.0"
