[package]
name = "licoup-foundation"
version = "0.3.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# Test-only zeroize observation probes consumed by the custody test suites.
test-support = []

[dependencies]
anyhow.workspace = true
fs2.workspace = true
flate2.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tar.workspace = true
url.workspace = true
zip.workspace = true
zeroize.workspace = true

[dev-dependencies]
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { version = "0.27", default-features = false, features = ["fs", "user"] }
