[[agents]]
id = "workbuddy"
history = [
  { path = "{home}/.workbuddy", kind = "workbuddy-app-state" },
]

[[agents]]
id = "codebuddy"
history = [
  { path = "{home}/.codebuddy/history.jsonl", kind = "codebuddy-global-history" },
  { path = "{home}/.codebuddy/sessions", kind = "codebuddy-session-store" },
  { path = "{home}/.codebuddy/projects", kind = "codebuddy-project-transcripts" },
]

[[agents]]
id = "trae-work"
history = [
  { path = "{home}/.trae/sessions", kind = "trae-work-session-store" },
]

[[agents]]
id = "trae-agent"

[[agents]]
id = "deepseek-harness"
