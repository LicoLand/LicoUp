[package]
name = "licoup-native"
version = "0.3.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = []
# Hermetic work-context constructors for integration tests. Not production.
# The interaction routes and the environment pinning helpers moved down to
# `licoup-foundation`, the group-operation seams the MLS callers drive moved to
# `licoup-secure-mesh`, and the relay family's fixtures moved to `licoup-relay`
# with the trees that own them, so the feature reaches all three there.
test-support = [
  "licoup-foundation/test-support",
  "licoup-secure-mesh/test-support",
  "licoup-relay/test-support",
  # The scan isolation seam the catalog fixtures drive moved to
  # `licoup-agent-targets` with the targets tree, so the feature reaches there
  # too.
  "licoup-agent-targets/test-support",
  # The ACP transport's replay arms, its protocol vocabulary and its session
  # bounds, which this host's own Hermes and replay suites drive. They moved to
  # `licoup-agent-drivers` with the trees that own them, and a `cfg(test)` seam
  # there is compiled out of this host's test build because this host links that
  # crate as a dependency — so the seam is a feature and this is the build that
  # enables it.
  "licoup-agent-drivers/test-support",
]
# Explicit non-production topology support. Release profiles are rejected in `lib.rs`.
# The Key Transparency acceptance authority moved to `licoup-secure-mesh` with the
# module that composes it, and the directory-transparency callers that read it
# moved to `licoup-relay`, so the feature reaches both there as well.
secure-mesh-acceptance-mock-kt = [
  "licoup-secure-mesh/secure-mesh-acceptance-mock-kt",
  "licoup-relay/secure-mesh-acceptance-mock-kt",
]

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
lico-catalog-convergence = { path = "../lico-catalog-convergence" }
licoup-protocol-bindings = { path = "../licoup-protocol-bindings" }
licoup-foundation = { path = "../licoup-foundation" }
licoup-client-state = { path = "../licoup-client-state" }
# The Agent inventory — the target catalog, its discovery and the packaged
# declarations — lives in its own crate below this host. This crate consumes it
# and re-exports the former paths; the dependency never runs the other way, and
# the facts the inventory reads from the layers above it arrive through the
# port `target_port` composes here.
licoup-agent-targets = { path = "../licoup-agent-targets" }
# The mesh cryptography now lives in its own crate. This crate consumes it and
# re-exports the former paths from `core`; the dependency never runs the other way.
licoup-secure-mesh = { path = "../licoup-secure-mesh" }
# The relay's trust and transport base now lives in its own crate. This crate
# consumes it and re-exports the former paths from `domain::mobile_relay` and
# `platform`; the dependency never runs the other way.
licoup-relay = { path = "../licoup-relay" }
licoup-endpoint-core = { path = "../licoup-endpoint-core" }
licoup-platform-bridges = { path = "../licoup-platform-bridges" }
licoup-agent-adapters = { path = "../licoup-agent-adapters" }
# The shared vocabulary every Agent adapter program uses — the line framing, the
# adapter declaration, the transition vocabulary, the registry lookup and the
# replay harness. The thirteen per-Agent parsers stay in this host until each
# Agent's own crate exists, and this host composes them into the port that crate
# declares.
licoup-agent-adapter-sdk = { path = "../licoup-agent-adapter-sdk" }
# The host-side work-context seam — the binding contract, the adapter transport,
# the production host driver and the C01 effect port. This host consumes it and
# composes the port it declares: the two Agents' protocol adapters and driver
# executions, and this host's own lane reach. The dependency never runs the
# other way, and no Agent is named in the seam.
licoup-agent-drivers = { path = "../licoup-agent-drivers" }
licoup-agent-runtime = { path = "../licoup-agent-runtime" }
licoup-application = { path = "../licoup-application" }
licoup-extension-contracts = { path = "../licoup-extension-contracts" }
licoup-workflow = { path = "../licoup-workflow" }
licoup-workflow-runtime = { path = "../licoup-workflow-runtime" }
licoup-workflow-store = { path = "../licoup-workflow-store" }
licoup-conversation = { path = "../licoup-conversation" }
# The MCP registry, transport and approval modules now live in their own crate,
# including the bundled usage Skill's identity. This crate consumes it and keeps
# the former module paths reachable; the dependency never runs the other way.
licoup-mcp = { path = "../licoup-mcp" }
anyhow.workspace = true
thiserror.workspace = true
base64.workspace = true
chacha20poly1305.workspace = true
command-group.workspace = true
hkdf.workspace = true
hmac.workspace = true
jni.workspace = true
mime_guess.workspace = true
serde.workspace = true
serde_json.workspace = true
semver.workspace = true
sha2.workspace = true
subtle.workspace = true
fs2.workspace = true
interprocess.workspace = true
icu_segmenter.workspace = true
libcrux-ml-kem.workspace = true
libcrux-sha3.workspace = true
libcrux-traits.workspace = true
libc.workspace = true
trash.workspace = true
openmls.workspace = true
openmls_basic_credential.workspace = true
openmls_memory_storage.workspace = true
openmls_rust_crypto.workspace = true
openmls_traits.workspace = true
rusqlite.workspace = true
log.workspace = true
env_logger.workspace = true
time.workspace = true
ureq.workspace = true
url.workspace = true
uuid.workspace = true
toml.workspace = true
ed25519-dalek.workspace = true
rand_core.workspace = true
regex.workspace = true
x25519-dalek.workspace = true
zeroize.workspace = true
tar.workspace = true
flate2.workspace = true
zip.workspace = true

# The macOS LocalAuthentication and CoreFoundation bindings moved down to
# `licoup-foundation` with the user-presence primitive, and the Security.framework
# and CoreFoundation bindings the platform secret store reaches moved up to
# `licoup-secure-mesh` with that store. No code here names them, and the Linux
# Secret Service crate followed the platform store into the same crate, so this
# manifest declares no macOS- or Linux-only dependency of its own.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.27", default-features = false, features = ["fs", "user", "signal", "socket"] }

[dev-dependencies]
licoarc.workspace = true
licoup-conversation = { path = "../licoup-conversation", features = ["test-counters"] }
# The interaction routes moved to `licoup-foundation`; the tests that park and
# wait on a route there need its test-support surface, which production builds
# never compile.
licoup-foundation = { path = "../licoup-foundation", features = ["test-support"] }
licoup-agent-drivers = { path = "../licoup-agent-drivers", features = ["test-support"] }
# The scan isolation seam the catalog fixtures drive travels behind this crate's
# explicit feature, because `cfg(test)` is false for a dependency.
licoup-agent-targets = { path = "../licoup-agent-targets", features = ["test-support"] }
# The relay family's trees moved to `licoup-relay` with the fixtures and the
# secure-command execution fixture the native suites drive, so this test build
# enables that crate's test-support surface as well.
licoup-relay = { path = "../licoup-relay", features = [
  "secure-mesh-acceptance-mock-kt",
  "test-support",
] }
# The Key Transparency acceptance authority moved to `licoup-secure-mesh` with
# the module that composes it, and the group-operation seams the MLS callers
# drive moved there too. The directory and journal-recovery suites read those
# surfaces, which production builds never compile: `cfg(test)` is false for a
# dependency.
licoup-secure-mesh = { path = "../licoup-secure-mesh", features = [
  "secure-mesh-acceptance-mock-kt",
  "test-support",
] }
trybuild = { path = "../trybuild" }
criterion = "0.5"
rand_chacha = "0.3"
# Bench-only async runtime: production target builds without tokio; benches
# drive the async backend lanes under criterion.
tokio = { version = "1", features = ["rt", "sync", "macros"] }

[build-dependencies]
licoup-state-machine-codegen = { path = "../licoup-state-machine-codegen" }

[[bench]]
name = "native_backend"
harness = false

[[bin]]
name = "licoup-cli"
path = "src/bin/licoup.rs"



[[bin]]
name = "lico-gateway"
path = "src/bin/lico-gateway.rs"

[[bin]]
name = "lico-llm-gateway"
path = "src/bin/lico-llm-gateway.rs"

[[bin]]
name = "lico-agent"
path = "src/bin/lico-agent.rs"

# The Key Transparency acceptance authority moved to `licoup-secure-mesh` with
# the tree that composes it, so its acceptance binary is declared there.

[[test]]
name = "continuity_host"
path = "tests/continuity_host.rs"
required-features = ["test-support"]

[[test]]
name = "continuity_native"
path = "tests/continuity_native.rs"
required-features = ["test-support"]

# V7-X2: real untrusted-extension process isolation. The suite lives outside the
# crate so the isolation contract is read from the repository root; wiring the
# target is a root-manifest change (see the task's interface note).
[[test]]
name = "extension_isolation"
path = "../../tests/integration/extension_isolation/main.rs"
