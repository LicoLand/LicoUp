[package]
name = "licoup-agent-antigravity"
version = "0.14.0"
edition = "2024"
rust-version = "1.95.0"
license = "AGPL-3.0-or-later"
repository = "https://github.com/LicoLand/LicoUp.git"
description = "Antigravity adapter package: the Antigravity CLI driver, its Agent Hooks receipt and its PTY protocol"

# The crate is one package's program. `parser` is this Agent's vendor protocol
# below the adapter port: the official Agent Hooks receipt reader, the PTY
# stdout parser and the terminal classification that together decide what one
# Antigravity turn produced, classified once, per ADR-0008. `port` is the seam
# the host answers, `registration` is what composition injects into
# `licoup-agent-adapter-sdk`, `hook` is the native receipt writer the Agent
# Hooks configuration starts, and `replay` is the arm that drives the same
# parser from a recorded transcript.
#
# The kernel links no part of this crate's protocol. Composition names the crate
# for its registration and its turn-event port while the extension host's binary
# route is completed by the agent-execution port; nothing here reaches back into
# a client crate.
[features]
default = []

[dependencies]
licoup-agent-adapter-sdk = { path = "../licoup-agent-adapter-sdk" }
# The shared ANSI stripper: the PTY lane's escape-sequence removal is the same
# implementation every Agent's PTY lane uses, so a control sequence is stripped
# once by one owner rather than re-implemented per Agent.
licoup-foundation = { path = "../licoup-foundation" }
serde.workspace = true
serde_json.workspace = true

[[bin]]
name = "lico-agent-antigravity"
path = "src/bin/lico-agent-antigravity.rs"

# Test-only. The committed package artifact is validated with the host's own
# manifest, permission and client-compatibility contract instead of a second
# reading of it. Nothing here enters the package binary, which links no kernel
# crate and reads its own package documents as data.
[dev-dependencies]
licoup-extension-contracts = { path = "../licoup-extension-contracts" }
