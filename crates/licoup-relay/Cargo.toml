[package]
name = "licoup-relay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = []
# The fixtures the native test surface drives. `cfg(test)` is false for a
# dependency, so a seam a test outside this crate reads travels as an explicit
# feature, which is `licoup-foundation`'s pattern. The fixtures read the
# acceptance authority and the secret-store probes `licoup-secure-mesh` exposes
# behind its own acceptance surface, so this feature carries both: the
# mock Key Transparency log and `SecretZeroizeProbe` live under
# `secure-mesh-acceptance-mock-kt`, which `licoup-secure-mesh`'s `lib.rs` still
# rejects in a release profile.
test-support = [
  "licoup-secure-mesh/test-support",
  "licoup-secure-mesh/secure-mesh-acceptance-mock-kt",
]
# Explicit non-production topology support, reaching the acceptance authority
# the directory-transparency callers read in `licoup-secure-mesh`.
secure-mesh-acceptance-mock-kt = ["licoup-secure-mesh/secure-mesh-acceptance-mock-kt"]

[dependencies]
anyhow.workspace = true
base64.workspace = true
# The pinned LicoArc Candidate contract owns every protocol decision and the
# cryptography; the durable endpoint storage here owns only what the SDK
# declares caller-owned.
licoup-protocol-bindings = { path = "../licoup-protocol-bindings" }
# The HTTPS-or-loopback origin rule the untrusted station adapter enforces is a
# process/IO boundary primitive and sits below this crate.
licoup-foundation = { path = "../licoup-foundation" }
# The portable client-state store the relay's own configuration, pairwise
# durability and target discovery read sits below this crate.
licoup-client-state = { path = "../licoup-client-state" }
# The platform secret store the durable endpoint snapshot is bound to is
# secure-mesh custody and lives in that crate, so the store is consumed at its
# owner's path and never the other way round.
licoup-secure-mesh = { path = "../licoup-secure-mesh" }
ed25519-dalek.workspace = true
fs2.workspace = true
hmac.workspace = true
rand_core.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
time.workspace = true
ureq.workspace = true
uuid.workspace = true
x25519-dalek.workspace = true
zeroize.workspace = true

[build-dependencies]
licoup-state-machine-codegen = { path = "../licoup-state-machine-codegen" }

[dev-dependencies]
# The relay family's directory-transparency and custody fixtures read the
# acceptance authority and the secret-store probes `licoup-secure-mesh` exposes
# only outside production builds, so this test build enables them here exactly
# as the native host's test build does.
licoup-secure-mesh = { path = "../licoup-secure-mesh", features = [
  "secure-mesh-acceptance-mock-kt",
  "test-support",
] }
