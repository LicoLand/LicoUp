name: Client regression

# Nightly full-regression graph for the LicoUp client. This workflow is
# scheduled, never a per-PR gate: Client CI, Branch flow, and Commit identity
# stay changed-path-scoped and untouched. Failures here are a
# traceable signal, not an author block.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  staged-regression:
    name: Staged module regression
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.44.2"
          cache: true
      - run: npm ci
      - name: Resolve Flutter dependencies for regression modules
        run: npm run client:get
      # foundation -> frontend -> backend -> integration -> scenarios ->
      # compatibility. `--static-compatibility` keeps the compatibility
      # frontier read-only: eligible live entries are probed and degrade to
      # "unverified" instead of running a forced-reply conversation, so a
      # missing live agent can never fake-pass and no prompt is ever injected
      # in an unsupervised run.
      - name: Run the staged full regression graph
        run: npm run client:regression:nightly
      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: client-regression-reports
          path: |
            build/reports/
            build/test-reports/
          if-no-files-found: ignore
          retention-days: 14

  contract-bundles:
    name: Node-only contract source-bundle tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Run every contract source-bundle test
        run: npm run client:contract:bundles:test
