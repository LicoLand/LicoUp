name: Release ready

on:
  pull_request:
    branches:
      - release

permissions:
  contents: read

concurrency:
  group: release-ready-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  release-ready:
    name: Release ready
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Verify promotion source
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          test "$HEAD_REPOSITORY" = "$TARGET_REPOSITORY"
          test "$HEAD_BRANCH" = stable
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: Select the author README fast path
        id: readme
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tools/scripts/readme-fast-path.mjs classify --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Complete the author README fast path
        if: steps.readme.outputs.readme_fast == 'true'
        run: echo "Author README update requires no release-policy checks."
      - run: npm ci
        if: steps.readme.outputs.readme_fast != 'true'
      - name: Verify promotion and publication topology
        if: steps.readme.outputs.readme_fast != 'true'
        run: npm run client:gate:topology
      - name: Verify release authority and publication readiness
        if: steps.readme.outputs.readme_fast != 'true'
        run: npm run client:gate:release-policy
