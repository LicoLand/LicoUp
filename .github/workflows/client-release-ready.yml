name: Release ready

on:
  pull_request:
    branches:
      - release

permissions:
  contents: read

concurrency:
  group: release-ready-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  docs-plan:
    name: Plan documentation fast path
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      docs_fast: ${{ steps.docs.outputs.docs_fast }}
    steps:
      - name: Verify promotion source
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          test "$HEAD_REPOSITORY" = "$TARGET_REPOSITORY"
          test "$HEAD_BRANCH" = stable
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Classify the pull request delta
        id: docs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tools/scripts/docs-fast-promotion.mjs plan --base "$BASE_SHA" --head "$HEAD_SHA"

  docs-fast:
    name: Documentation manifest and privacy
    if: ${{ needs.docs-plan.outputs.docs_fast == 'true' }}
    needs: docs-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Verify fixed manifest and basic privacy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tools/scripts/docs-fast-promotion.mjs verify --base "$BASE_SHA" --head "$HEAD_SHA"

  release-ready-full:
    name: Release ready full policy
    if: ${{ needs.docs-plan.outputs.docs_fast != 'true' }}
    needs: docs-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Verify promotion source
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          test "$HEAD_REPOSITORY" = "$TARGET_REPOSITORY"
          test "$HEAD_BRANCH" = stable
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Verify promotion and publication topology
        run: npm run client:gate:topology
      - name: Verify release authority and publication readiness
        run: npm run client:gate:release-policy

  release-ready:
    name: Release ready
    if: always()
    needs: [docs-plan, docs-fast, release-ready-full]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      DOCS_PLAN_RESULT: ${{ needs.docs-plan.result }}
      DOCS_FAST_SELECTED: ${{ needs.docs-plan.outputs.docs_fast }}
      DOCS_FAST_RESULT: ${{ needs.docs-fast.result }}
      FULL_RESULT: ${{ needs.release-ready-full.result }}
    steps:
      - name: Reduce release-readiness results
        run: |
          test "$DOCS_PLAN_RESULT" = success
          if [[ "$DOCS_FAST_SELECTED" == true ]]; then
            test "$DOCS_FAST_RESULT" = success
            test "$FULL_RESULT" = skipped
          else
            test "$DOCS_FAST_SELECTED" = false
            test "$DOCS_FAST_RESULT" = skipped
            test "$FULL_RESULT" = success
          fi
