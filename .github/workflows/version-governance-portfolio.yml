name: version-governance-portfolio

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_run:
    workflows:
      - version-governance
    types:
      - completed

permissions:
  contents: read
  pull-requests: read

jobs:
  pull-request-portfolio:
    if: ${{ github.event_name == 'pull_request_target' }}
    uses: LicoLand/.github/.github/workflows/reusable-version-governance.yml@834d4ee338062475b3401400e12c573fb05b4130
    with:
      governance_ref: "834d4ee338062475b3401400e12c573fb05b4130"
      target_repository: ${{ github.event.pull_request.head.repo.full_name }}
      target_ref: ${{ github.event.pull_request.head.sha }}
      expected_repository: ${{ github.repository }}
      plan_path: docs/releases/plan.json

  tag-portfolio:
    if: >-
      ${{
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push'
      }}
    uses: LicoLand/.github/.github/workflows/reusable-version-governance.yml@834d4ee338062475b3401400e12c573fb05b4130
    with:
      governance_ref: "834d4ee338062475b3401400e12c573fb05b4130"
      target_repository: ${{ github.repository }}
      target_ref: ${{ github.event.workflow_run.head_sha }}
      expected_repository: ${{ github.repository }}
      plan_path: docs/releases/plan.json
      tag: ${{ github.event.workflow_run.head_branch }}
      require_tag: true
