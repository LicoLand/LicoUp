name: Client release packages
run-name: ${{ inputs.phase }} ${{ inputs.release_tag }} ${{ inputs.targets }} ${{ inputs.correlation }}

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Prepare immutable packages or publish one prepared run
        required: true
        type: choice
        options:
          - prepare
          - publish
      release_tag:
        description: Exact version-authority tag
        required: true
        type: string
      targets:
        description: One or more comma-separated exact package targets
        required: true
        type: string
      correlation:
        description: Unique 64-character lowercase hexadecimal correlation
        required: true
        type: string
      prepare_run_id:
        description: Successful prepare run ID; publish only
        required: false
        default: ""
        type: string
      source_revision:
        description: Exact release revision prepared; publish only
        required: false
        default: ""
        type: string
      artifact_digests:
        description: JSON object mapping every package target to its installer sha256; publish only
        required: false
        default: ""
        type: string
      signed_update_manifest_base64:
        description: Locally signed public update manifest; publish only
        required: false
        default: ""
        type: string
      publish_release:
        description: Reconcile every selected package and publish the draft once
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: client-github-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  source:
    name: Bind immutable release request
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
      version: ${{ steps.matrix.outputs.version }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - name: Validate exact release authority and phase inputs
        env:
          PHASE: ${{ inputs.phase }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          TARGETS: ${{ inputs.targets }}
          CORRELATION: ${{ inputs.correlation }}
          PREPARE_RUN_ID: ${{ inputs.prepare_run_id }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
          ARTIFACT_DIGESTS: ${{ inputs.artifact_digests }}
          SIGNED_UPDATE_MANIFEST: ${{ inputs.signed_update_manifest_base64 }}
        run: |
          signed_manifest_present=false
          if [[ -n "$SIGNED_UPDATE_MANIFEST" ]]; then signed_manifest_present=true; fi
          node tools/scripts/client-release-workflow-binding.mjs \
            --mode request --phase "$PHASE" --tag "$RELEASE_TAG" --targets "$TARGETS" \
            --correlation "$CORRELATION" --ref "$GITHUB_REF" --sha "$GITHUB_SHA" \
            --source-revision "$SOURCE_REVISION" --prepare-run-id "$PREPARE_RUN_ID" \
            --artifact-digests "$ARTIFACT_DIGESTS" \
            --signed-manifest-present "$signed_manifest_present"
      - name: Resolve exact package matrix
        id: matrix
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          matrix="$(node tools/scripts/client-release-workflow-binding.mjs \
            --mode matrix --targets "$TARGETS")"
          echo "value=$matrix" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p \
            'require("./tools/client-version.json").productVersion')" >> "$GITHUB_OUTPUT"

  prepare:
    name: Prepare ${{ matrix.target }}
    if: ${{ inputs.phase == 'prepare' }}
    needs: [source]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.source.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: Install Rust toolchain for native package
        if: ${{ matrix.platform != 'android' }}
        uses: dtolnay/rust-toolchain@42520bdb3cb59f71dae6f8557f7056cf3a46c898 # 1.91.0
      - name: Install Rust toolchain for Android package
        if: ${{ matrix.platform == 'android' }}
        uses: dtolnay/rust-toolchain@42520bdb3cb59f71dae6f8557f7056cf3a46c898 # 1.91.0
        with:
          targets: aarch64-linux-android
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.44.2"
          cache: true
      - run: npm ci
      - name: Prepare stable Android signing identity
        if: ${{ matrix.target == 'android-direct-arm64-v8a' }}
        env:
          LICO_ANDROID_KEYSTORE_BASE64: ${{ secrets.LICO_ANDROID_KEYSTORE_BASE64 }}
          LICO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.LICO_ANDROID_KEYSTORE_PASSWORD }}
          LICO_ANDROID_KEY_ALIAS: ${{ secrets.LICO_ANDROID_KEY_ALIAS }}
          LICO_ANDROID_KEY_PASSWORD: ${{ secrets.LICO_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$LICO_ANDROID_KEYSTORE_BASE64"
          test -n "$LICO_ANDROID_KEYSTORE_PASSWORD"
          test -n "$LICO_ANDROID_KEY_ALIAS"
          test -n "$LICO_ANDROID_KEY_PASSWORD"
          printf '%s' "$LICO_ANDROID_KEYSTORE_BASE64" | \
            openssl base64 -d -A -out "$RUNNER_TEMP/licoup-release.jks"
          chmod 600 "$RUNNER_TEMP/licoup-release.jks"
          echo "LICO_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/licoup-release.jks" >> "$GITHUB_ENV"
          echo "LICO_ANDROID_KEYSTORE_PASSWORD=$LICO_ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "LICO_ANDROID_KEY_ALIAS=$LICO_ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "LICO_ANDROID_KEY_PASSWORD=$LICO_ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Install exact Android package toolchain
        if: ${{ matrix.platform == 'android' }}
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --install "ndk;30.0.14904198" < /dev/null
      - name: Build, stage, and verify exact package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          npm run client:release:build -- --target "$TARGET"
          npm run client:release:verify -- --target "$TARGET"
      - name: Verify build validity strategy
        run: npm run client:release:remote-strategy -- --expect build-success
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ${{ matrix.artifactName }}
          path: build/releases/${{ needs.source.outputs.version }}/${{ matrix.target }}/*
          if-no-files-found: error

  publish:
    name: Publish selected package set
    if: ${{ inputs.phase == 'publish' }}
    needs: [source]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - name: Download every selected prepared package
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARE_RUN_ID: ${{ inputs.prepare_run_id }}
          TARGETS: ${{ inputs.targets }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREPARE_RUN_ID" \
            > "$RUNNER_TEMP/prepare-run.json"
          mkdir -p build/release-incoming
          IFS=',' read -ra selected_targets <<< "$TARGETS"
          for target in "${selected_targets[@]}"; do
            mkdir -p "build/release-incoming/$target"
            gh run download "$PREPARE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "licoup-$target" --dir "build/release-incoming/$target"
          done
      - name: Verify prepare metadata and every exact artifact digest
        env:
          PREPARE_RUN_ID: ${{ inputs.prepare_run_id }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          TARGETS: ${{ inputs.targets }}
          CORRELATION: ${{ inputs.correlation }}
          ARTIFACT_DIGESTS: ${{ inputs.artifact_digests }}
        run: |
          node tools/scripts/client-release-workflow-binding.mjs \
            --mode prepare-run --run-json "$RUNNER_TEMP/prepare-run.json" \
            --prepare-run-id "$PREPARE_RUN_ID" --source-revision "$SOURCE_REVISION" \
            --tag "$RELEASE_TAG" --targets "$TARGETS" --correlation "$CORRELATION" \
            --artifacts build/release-incoming --artifact-digests "$ARTIFACT_DIGESTS"
      - name: Create, reconcile, and publish once
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
          LICO_RELEASE_SOURCE_REVISION: ${{ inputs.source_revision }}
          LICO_SIGNED_UPDATE_MANIFEST_BASE64: ${{ inputs.signed_update_manifest_base64 }}
        run: |
          node tools/scripts/client-github-release-publish.mjs \
            --tag "${{ inputs.release_tag }}" --targets "${{ inputs.targets }}" \
            --incoming-root build/release-incoming --assets build/release-assets \
            --publish "$PUBLISH_RELEASE"
