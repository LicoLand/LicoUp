name: Client GitHub release artifact

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub Release tag to create or extend
        required: true
        type: string
      target:
        description: Independently releasable platform target
        required: true
        type: choice
        options:
            - macos-arm64
            - linux-glibc-arm64
            - android-arm64
      publish_release:
        description: Publish after this target and the merged manifest verify
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: client-github-release-${{ inputs.release_tag }}-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  source:
    name: Source policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: Validate release request
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]{0,126}$ ]]; then
            echo "Invalid GitHub Release tag" >&2
            exit 1
          fi
      - run: npm ci
      - name: Run source policy against the previously audited release commit
        env:
          LICO_AUDITOR_GATE_DELEGATED: "1"
        run: npm run client:gate:source
      - name: Verify reproducible local-agent release UI contracts
        run: npm run client:verify:agent-conversations:release-ui

  dependencies:
    name: Dependency policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@42520bdb3cb59f71dae6f8557f7056cf3a46c898 # 1.91.0
      - run: npm ci
      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - run: npm run client:gate:dependencies

  release-policy:
    name: Release policy contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run client:gate:release-policy

  build-macos:
    name: Build macOS ARM64
    if: ${{ inputs.target == 'macos-arm64' }}
    needs: [source, dependencies, release-policy]
    runs-on: macos-15
    timeout-minutes: 90
    env:
      LICO_CLIENT_RELEASE_TARGETS: macos-arm64
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@42520bdb3cb59f71dae6f8557f7056cf3a46c898 # 1.91.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.44.2"
          cache: true
      - run: npm ci
      - name: Prepare ephemeral local integrity identity
        run: |
          openssl req -x509 -newkey rsa:3072 -nodes -days 1 \
            -keyout "$RUNNER_TEMP/lico-local-integrity.key" \
            -out "$RUNNER_TEMP/lico-local-integrity.pem" \
            -subj "/CN=LicoUp GitHub Artifact Validation" \
            -addext "extendedKeyUsage=codeSigning"
          openssl pkcs12 -export \
            -inkey "$RUNNER_TEMP/lico-local-integrity.key" \
            -in "$RUNNER_TEMP/lico-local-integrity.pem" \
            -out "$RUNNER_TEMP/lico-local-integrity.p12" \
            -passout pass:github-artifact
          security create-keychain -p github-artifact "$RUNNER_TEMP/lico-local-integrity.keychain-db"
          security unlock-keychain -p github-artifact "$RUNNER_TEMP/lico-local-integrity.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/lico-local-integrity.keychain-db"
          security import "$RUNNER_TEMP/lico-local-integrity.p12" \
            -k "$RUNNER_TEMP/lico-local-integrity.keychain-db" \
            -P github-artifact -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k github-artifact "$RUNNER_TEMP/lico-local-integrity.keychain-db"
          identity="$(security find-certificate -c "LicoUp GitHub Artifact Validation" \
            -Z "$RUNNER_TEMP/lico-local-integrity.keychain-db" | awk '/SHA-1/{print $3; exit}')"
          if [[ ! "$identity" =~ ^[A-F0-9]{40}$ ]]; then
            echo "Ephemeral local integrity identity was not created" >&2
            exit 1
          fi
          echo "LICO_MACOS_LOCAL_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Build, sign and install the local-integrity app
        run: npm run client:install:macos
      - name: Archive the exact verified macOS app
        run: npm run client:archive:macos-github-release
      - name: Emit consumer verification metadata
        run: |
          cd build/apps/desktop/distribution/macos
          shasum -a 256 LicoUp-macos-arm64.zip > LicoUp-macos-arm64.zip.sha256
      - name: Verify macOS GitHub Release acceptance
        run: npm run client:verify:github-release
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: licoup-macos
          path: |
            build/apps/desktop/distribution/macos/LicoUp-macos-arm64.zip
            build/apps/desktop/distribution/macos/LicoUp-macos-arm64.zip.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: licoup-macos-update
          path: |
            build/apps/desktop/distribution/macos/LicoUp-macos-arm64-update.tar.gz
            build/apps/desktop/distribution/macos/LicoUp-macos-arm64-update.tar.gz.sha256
          if-no-files-found: error

  build-linux-arm64:
    name: Build Linux glibc ARM64
    if: ${{ inputs.target == 'linux-glibc-arm64' }}
    needs: [source, dependencies, release-policy]
    runs-on: [self-hosted, linux, ARM64, lico-release]
    timeout-minutes: 90
    env:
      LICO_CLIENT_RELEASE_TARGETS: linux-glibc-arm64
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@42520bdb3cb59f71dae6f8557f7056cf3a46c898 # 1.91.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.44.2"
          cache: true
      - run: npm ci
      - run: npm run client:build:linux
      - run: npm run client:linux:smoke
      - run: npm run client:linux:gui-smoke
      - name: Prepare ephemeral GitHub artifact verification key
        run: |
          openssl genpkey -algorithm ED25519 -out "$RUNNER_TEMP/linux-release-signing-key.pem"
          openssl pkey -in "$RUNNER_TEMP/linux-release-signing-key.pem" -pubout -out "$RUNNER_TEMP/linux-release-verification-key.pem"
          chmod 600 "$RUNNER_TEMP/linux-release-signing-key.pem"
      - name: Sign and archive Linux ARM64 distribution
        env:
          LICO_LINUX_RELEASE_SIGNING_KEY_PATH: ${{ runner.temp }}/linux-release-signing-key.pem
          LICO_LINUX_RELEASE_SIGNING_KEY_ID: linux-vm-acceptance
        run: npm run client:archive:linux-arm64
      - name: Publish public verification material with artifact
        run: cp "$RUNNER_TEMP/linux-release-verification-key.pem" build/apps/desktop/distribution/linux-arm64/
      - name: Verify Linux GitHub Release acceptance
        run: npm run client:verify:github-release
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: licoup-linux-arm64
          path: |
            build/apps/desktop/distribution/linux-arm64/LicoUp-linux-arm64.tar.gz
            build/apps/desktop/distribution/linux-arm64/LicoUp-linux-arm64.tar.gz.sha256
            build/apps/desktop/distribution/linux-arm64/LicoUp-linux-arm64.tar.gz.sig
            build/apps/desktop/distribution/linux-arm64/linux-release-verification-key.pem
          if-no-files-found: error

  build-android-arm64:
    name: Build Android ARM64
    if: ${{ inputs.target == 'android-arm64' }}
    needs: [source, dependencies, release-policy]
    runs-on: [self-hosted, macOS, ARM64, lico-release, android]
    timeout-minutes: 90
    env:
      JAVA_HOME: /Applications/Android Studio.app/Contents/jbr/Contents/Home
      LICO_CLIENT_RELEASE_TARGETS: android-arm64
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@42520bdb3cb59f71dae6f8557f7056cf3a46c898 # 1.91.0
        with:
          targets: aarch64-linux-android
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.44.2"
          cache: true
      - run: npm ci
      - name: Build same-source macOS relay CLI prerequisite
        run: npm run client:build:macos
      - name: Install pinned Android NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;30.0.14904198" < /dev/null
          test -d "$ANDROID_HOME/ndk/30.0.14904198"
      - name: Run Android authorization policy tests
        working-directory: apps/desktop/android
        run: ./gradlew testDebugUnitTest
      - name: Prepare ephemeral Android install key
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/lico-github-artifact.jks" -storepass github-artifact -keypass github-artifact -alias github-artifact -keyalg RSA -keysize 3072 -validity 30 -dname "CN=LicoUp GitHub Artifact Validation"
          chmod 600 "$RUNNER_TEMP/lico-github-artifact.jks"
          keytool -exportcert -rfc -keystore "$RUNNER_TEMP/lico-github-artifact.jks" -storepass github-artifact -alias github-artifact -file "$RUNNER_TEMP/lico-github-artifact.pem"
      - name: Build signed Android ARM64 release
        env:
          LICO_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/lico-github-artifact.jks
          LICO_ANDROID_KEYSTORE_PASSWORD: github-artifact
          LICO_ANDROID_KEY_ALIAS: github-artifact
          LICO_ANDROID_KEY_PASSWORD: github-artifact
          LICO_ANDROID_TARGET_PLATFORM: android-arm64
        run: npm run client:build:android
      - run: npm run client:verify:android-apk
      - name: Publish public verification material with artifact
        run: |
          cp "$RUNNER_TEMP/lico-github-artifact.pem" build/apps/desktop/android/release/
          cp build/apps/desktop/android/release/app-release.apk build/apps/desktop/android/release/LicoUp-android-arm64.apk
          cd build/apps/desktop/android/release
          shasum -a 256 LicoUp-android-arm64.apk > LicoUp-android-arm64.apk.sha256
      - name: Verify Android GitHub Release acceptance
        run: npm run client:verify:github-release
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: licoup-android-arm64
          path: |
            build/apps/desktop/android/release/LicoUp-android-arm64.apk
            build/apps/desktop/android/release/LicoUp-android-arm64.apk.sha256
            build/apps/desktop/android/release/lico-github-artifact.pem
          if-no-files-found: error

  publish-macos:
    name: Append macOS ARM64
    if: ${{ inputs.target == 'macos-arm64' }}
    needs: [source, dependencies, release-policy, build-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: client-github-release-publish-${{ inputs.release_tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: licoup-macos
          path: build/release-incoming
      - name: Append target and verify merged Release
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: node tools/scripts/client-github-release-publish.mjs --tag "${{ inputs.release_tag }}" --target "${{ inputs.target }}" --incoming build/release-incoming --assets build/release-assets --publish "$PUBLISH_RELEASE"

  publish-linux-arm64:
    name: Append Linux glibc ARM64
    if: ${{ inputs.target == 'linux-glibc-arm64' }}
    needs: [source, dependencies, release-policy, build-linux-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: client-github-release-publish-${{ inputs.release_tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: licoup-linux-arm64
          path: build/release-incoming
      - name: Append target and verify merged Release
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: node tools/scripts/client-github-release-publish.mjs --tag "${{ inputs.release_tag }}" --target "${{ inputs.target }}" --incoming build/release-incoming --assets build/release-assets --publish "$PUBLISH_RELEASE"

  publish-android-arm64:
    name: Append Android ARM64
    if: ${{ inputs.target == 'android-arm64' }}
    needs: [source, dependencies, release-policy, build-android-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: client-github-release-publish-${{ inputs.release_tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: licoup-android-arm64
          path: build/release-incoming
      - name: Append target and verify merged Release
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: node tools/scripts/client-github-release-publish.mjs --tag "${{ inputs.release_tag }}" --target "${{ inputs.target }}" --incoming build/release-incoming --assets build/release-assets --publish "$PUBLISH_RELEASE"
