name: Client GitHub release artifact
run-name: ${{ inputs.phase }} ${{ inputs.release_tag }} ${{ inputs.target }} ${{ inputs.correlation }}

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Prepare immutable artifacts or publish one prepared run
        required: true
        type: choice
        options:
          - prepare
          - publish
      release_tag:
        description: Exact version-authority tag
        required: true
        type: string
      target:
        description: Exact release target
        required: true
        type: choice
        options:
          - macos-arm64
      correlation:
        description: Unique 64-character lowercase hexadecimal correlation
        required: true
        type: string
      prepare_run_id:
        description: Successful prepare run ID; publish only
        required: false
        default: ""
        type: string
      source_revision:
        description: Exact release revision prepared; publish only
        required: false
        default: ""
        type: string
      artifact_digest:
        description: Exact prepared DMG sha256 digest; publish only
        required: false
        default: ""
        type: string
      signed_update_manifest_base64:
        description: Locally signed public update manifest; publish only
        required: false
        default: ""
        type: string
      publish_release:
        description: Reconcile the draft and publish it once
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: client-github-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  source:
    name: Bind immutable release request
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - name: Validate exact release authority and phase inputs
        env:
          PHASE: ${{ inputs.phase }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          TARGET: ${{ inputs.target }}
          CORRELATION: ${{ inputs.correlation }}
          PREPARE_RUN_ID: ${{ inputs.prepare_run_id }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
          ARTIFACT_DIGEST: ${{ inputs.artifact_digest }}
          SIGNED_UPDATE_MANIFEST: ${{ inputs.signed_update_manifest_base64 }}
        run: |
          signed_manifest_present=false
          if [[ -n "$SIGNED_UPDATE_MANIFEST" ]]; then signed_manifest_present=true; fi
          node tools/scripts/client-release-workflow-binding.mjs \
            --mode request --phase "$PHASE" --tag "$RELEASE_TAG" --target "$TARGET" \
            --correlation "$CORRELATION" --ref "$GITHUB_REF" --sha "$GITHUB_SHA" \
            --source-revision "$SOURCE_REVISION" --prepare-run-id "$PREPARE_RUN_ID" \
            --artifact-digest "$ARTIFACT_DIGEST" \
            --signed-manifest-present "$signed_manifest_present"

  prepare-macos:
    name: Prepare macOS ARM64
    if: ${{ inputs.phase == 'prepare' && inputs.target == 'macos-arm64' }}
    needs: [source]
    runs-on: macos-15
    timeout-minutes: 90
    env:
      LICO_CLIENT_RELEASE_TARGETS: macos-arm64
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@42520bdb3cb59f71dae6f8557f7056cf3a46c898 # 1.91.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.44.2"
          cache: true
      - run: npm ci
      - name: Import stable LicoUp Release identity
        env:
          LICO_MACOS_RELEASE_CERTIFICATE_P12: ${{ secrets.LICO_MACOS_RELEASE_CERTIFICATE_P12 }}
          LICO_MACOS_RELEASE_CERTIFICATE_PASSWORD: ${{ secrets.LICO_MACOS_RELEASE_CERTIFICATE_PASSWORD }}
          LICO_MACOS_RELEASE_SIGNER_SHA256: ${{ secrets.LICO_MACOS_RELEASE_SIGNER_SHA256 }}
        run: |
          test -n "$LICO_MACOS_RELEASE_CERTIFICATE_P12"
          test -n "$LICO_MACOS_RELEASE_CERTIFICATE_PASSWORD"
          test -n "$LICO_MACOS_RELEASE_SIGNER_SHA256"
          printf '%s' "$LICO_MACOS_RELEASE_CERTIFICATE_P12" | \
            openssl base64 -d -A -out "$RUNNER_TEMP/licoup-release.p12"
          security create-keychain -p github-artifact "$RUNNER_TEMP/licoup-release.keychain-db"
          security unlock-keychain -p github-artifact "$RUNNER_TEMP/licoup-release.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/licoup-release.keychain-db"
          security import "$RUNNER_TEMP/licoup-release.p12" \
            -k "$RUNNER_TEMP/licoup-release.keychain-db" \
            -P "$LICO_MACOS_RELEASE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k github-artifact "$RUNNER_TEMP/licoup-release.keychain-db"
          security find-identity -v -p codesigning \
            "$RUNNER_TEMP/licoup-release.keychain-db" | grep -F 'LicoUp Release'
          echo "LICO_MACOS_RELEASE_SIGNING_IDENTITY=LicoUp Release" >> "$GITHUB_ENV"
          echo "LICO_MACOS_RELEASE_SIGNING_KEYCHAIN=$RUNNER_TEMP/licoup-release.keychain-db" >> "$GITHUB_ENV"
          echo "LICO_MACOS_RELEASE_SIGNER_SHA256=$LICO_MACOS_RELEASE_SIGNER_SHA256" >> "$GITHUB_ENV"
      - name: Build and sign exact application
        run: |
          npm run client:build:macos
          npm run client:install:macos:identity
          npm run client:archive:macos-github-release
      - name: Verify build validity strategy
        run: npm run client:release:remote-strategy -- --expect build-success
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: licoup-macos
          path: |
            build/apps/desktop/distribution/macos/LicoUp-macos-arm64.dmg
            build/apps/desktop/distribution/macos/LicoUp-macos-arm64.dmg.sha256
            build/apps/desktop/distribution/macos/LicoUp-macos-arm64-update.zip
            build/apps/desktop/distribution/macos/LicoUp-macos-arm64-update.zip.sha256
          if-no-files-found: error

  publish-macos:
    name: Publish prepared macOS ARM64
    if: ${{ inputs.phase == 'publish' && inputs.target == 'macos-arm64' }}
    needs: [source]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - name: Download the one bound prepare artifact
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARE_RUN_ID: ${{ inputs.prepare_run_id }}
        run: |
          mkdir -p build/release-incoming
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREPARE_RUN_ID" \
            > "$RUNNER_TEMP/prepare-run.json"
          gh run download "$PREPARE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name licoup-macos --dir build/release-incoming
      - name: Verify prepare metadata and exact artifact digest
        env:
          PREPARE_RUN_ID: ${{ inputs.prepare_run_id }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          TARGET: ${{ inputs.target }}
          CORRELATION: ${{ inputs.correlation }}
          ARTIFACT_DIGEST: ${{ inputs.artifact_digest }}
        run: |
          node tools/scripts/client-release-workflow-binding.mjs \
            --mode prepare-run --run-json "$RUNNER_TEMP/prepare-run.json" \
            --prepare-run-id "$PREPARE_RUN_ID" --source-revision "$SOURCE_REVISION" \
            --tag "$RELEASE_TAG" --target "$TARGET" --correlation "$CORRELATION" \
            --artifacts build/release-incoming --artifact-digest "$ARTIFACT_DIGEST"
      - name: Create, reconcile, and publish once
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
          LICO_RELEASE_SOURCE_REVISION: ${{ inputs.source_revision }}
          LICO_SIGNED_UPDATE_MANIFEST_BASE64: ${{ inputs.signed_update_manifest_base64 }}
        run: |
          node tools/scripts/client-github-release-publish.mjs \
            --tag "${{ inputs.release_tag }}" --target "${{ inputs.target }}" \
            --incoming build/release-incoming --assets build/release-assets \
            --publish "$PUBLISH_RELEASE"
