name: Client GitHub release artifact

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub Release tag to create or extend
        required: true
        type: string
      target:
        description: Independently releasable platform target
        required: true
        type: choice
        options:
            - macos-arm64
            - linux-glibc-arm64
            - android-arm64
      publish_release:
        description: Publish after this target and the merged manifest verify
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: client-github-release-${{ inputs.release_tag }}-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate release request
    runs-on: ubuntu-24.04
    steps:
      - env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]{0,126}$ ]]; then
            echo "Invalid GitHub Release tag" >&2
            exit 1
          fi

  build-macos:
    name: Build macOS ARM64
    if: ${{ inputs.target == 'macos-arm64' }}
    needs: preflight
    runs-on: macos-15
    env:
      LICO_CLIENT_RELEASE_TARGETS: macos-arm64
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@42520bdb3cb59f71dae6f8557f7056cf3a46c898 # 1.91.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.44.2"
          cache: true
      - run: npm ci
      - name: Populate the locked Flutter package cache
        working-directory: apps/desktop
        run: flutter pub get --enforce-lockfile
      - name: Import the stable macOS release identity
        env:
          RELEASE_CERTIFICATE_P12_BASE64: ${{ secrets.LICO_MACOS_RELEASE_CERTIFICATE_P12_BASE64 }}
          RELEASE_CERTIFICATE_PASSWORD: ${{ secrets.LICO_MACOS_RELEASE_CERTIFICATE_PASSWORD }}
          RELEASE_SIGNER_SHA256: ${{ vars.LICO_MACOS_RELEASE_SIGNER_SHA256 }}
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_CERTIFICATE_P12_BASE64" || \
                -z "$RELEASE_CERTIFICATE_PASSWORD" || \
                ! "$RELEASE_SIGNER_SHA256" =~ ^(sha256:)?[a-fA-F0-9]{64}$ ]]; then
            echo "Stable macOS release identity configuration is incomplete" >&2
            exit 1
          fi
          release_keychain_password="$(openssl rand -hex 32)"
          printf '%s' "$RELEASE_CERTIFICATE_P12_BASE64" | \
            /usr/bin/base64 -D > "$RUNNER_TEMP/licoup-release-identity.p12"
          chmod 600 "$RUNNER_TEMP/licoup-release-identity.p12"
          RELEASE_CERTIFICATE_PASSWORD="$RELEASE_CERTIFICATE_PASSWORD" \
            openssl pkcs12 \
              -in "$RUNNER_TEMP/licoup-release-identity.p12" \
              -clcerts -nokeys \
              -passin env:RELEASE_CERTIFICATE_PASSWORD \
              -out "$RUNNER_TEMP/licoup-release-identity.pem"
          security create-keychain -p "$release_keychain_password" \
            "$RUNNER_TEMP/licoup-release-identity.keychain-db"
          security set-keychain-settings -lut 7200 \
            "$RUNNER_TEMP/licoup-release-identity.keychain-db"
          security unlock-keychain -p "$release_keychain_password" \
            "$RUNNER_TEMP/licoup-release-identity.keychain-db"
          existing_keychains=()
          while IFS= read -r keychain; do
            keychain="${keychain//\"/}"
            if [[ -n "$keychain" ]]; then
              existing_keychains+=("$keychain")
            fi
          done < <(security list-keychains -d user)
          security list-keychains -d user -s \
            "$RUNNER_TEMP/licoup-release-identity.keychain-db" \
            "${existing_keychains[@]}"
          security import "$RUNNER_TEMP/licoup-release-identity.p12" \
            -k "$RUNNER_TEMP/licoup-release-identity.keychain-db" \
            -P "$RELEASE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          sudo -n security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain \
            "$RUNNER_TEMP/licoup-release-identity.pem"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$release_keychain_password" \
            "$RUNNER_TEMP/licoup-release-identity.keychain-db"
          identities="$(security find-identity -v -p codesigning \
            "$RUNNER_TEMP/licoup-release-identity.keychain-db" | \
            awk '/^[[:space:]]*[0-9]+\)/{print $2}')"
          identity_count="$(printf '%s\n' "$identities" | awk 'NF{count++} END{print count+0}')"
          identity="$(printf '%s\n' "$identities" | awk 'NF{print; exit}')"
          if [[ "$identity_count" -ne 1 || ! "$identity" =~ ^[A-F0-9]{40}$ ]]; then
            echo "Stable macOS release identity is not unique" >&2
            exit 1
          fi
          echo "LICO_MACOS_RELEASE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "LICO_MACOS_RELEASE_SIGNING_KEYCHAIN=$RUNNER_TEMP/licoup-release-identity.keychain-db" >> "$GITHUB_ENV"
          echo "LICO_MACOS_RELEASE_SIGNER_SHA256=$RELEASE_SIGNER_SHA256" >> "$GITHUB_ENV"
      - name: Build, sign and install with the stable release identity
        run: npm run client:install:macos
      - name: Apply remote release validity strategy
        run: npm run client:release:remote-strategy -- --expect build-success
      - name: Archive the exact verified macOS app
        run: npm run client:archive:macos-github-release
      - name: Install and launch the exact release ZIP
        run: npm run client:verify:macos-release-artifact
      - name: Emit consumer verification metadata
        run: |
          cp tools/install-macos.sh build/apps/desktop/distribution/macos/install-macos.sh
          cd build/apps/desktop/distribution/macos
          shasum -a 256 LicoUp-macos-arm64.zip > LicoUp-macos-arm64.zip.sha256
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: licoup-macos
          path: |
            build/apps/desktop/distribution/macos/LicoUp-macos-arm64.zip
            build/apps/desktop/distribution/macos/LicoUp-macos-arm64.zip.sha256
            build/apps/desktop/distribution/macos/install-macos.sh
          if-no-files-found: error
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: licoup-macos-update
          path: |
            build/apps/desktop/distribution/macos/LicoUp-macos-arm64-update.tar.gz
            build/apps/desktop/distribution/macos/LicoUp-macos-arm64-update.tar.gz.sha256
          if-no-files-found: error
      - name: Remove the temporary release keychain
        if: always()
        run: |
          if [[ -n "${LICO_MACOS_RELEASE_SIGNING_IDENTITY:-}" ]]; then
            sudo -n security delete-certificate \
              -Z "$LICO_MACOS_RELEASE_SIGNING_IDENTITY" \
              /Library/Keychains/System.keychain >/dev/null 2>&1 || true
          fi
          if [[ -n "${LICO_MACOS_RELEASE_SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$LICO_MACOS_RELEASE_SIGNING_KEYCHAIN" || true
          fi

  build-linux-arm64:
    name: Build Linux glibc ARM64
    if: ${{ inputs.target == 'linux-glibc-arm64' }}
    needs: preflight
    runs-on: [self-hosted, linux, ARM64, lico-release]
    env:
      LICO_CLIENT_RELEASE_TARGETS: linux-glibc-arm64
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@42520bdb3cb59f71dae6f8557f7056cf3a46c898 # 1.91.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.44.2"
          cache: true
      - run: npm ci
      - run: npm run client:build:linux
      - name: Apply remote release validity strategy
        run: npm run client:release:remote-strategy -- --expect build-success
      - name: Prepare ephemeral GitHub artifact verification key
        run: |
          openssl genpkey -algorithm ED25519 -out "$RUNNER_TEMP/linux-release-signing-key.pem"
          openssl pkey -in "$RUNNER_TEMP/linux-release-signing-key.pem" -pubout -out "$RUNNER_TEMP/linux-release-verification-key.pem"
          chmod 600 "$RUNNER_TEMP/linux-release-signing-key.pem"
      - name: Sign and archive Linux ARM64 distribution
        env:
          LICO_LINUX_RELEASE_SIGNING_KEY_PATH: ${{ runner.temp }}/linux-release-signing-key.pem
          LICO_LINUX_RELEASE_SIGNING_KEY_ID: linux-vm-acceptance
        run: npm run client:archive:linux-arm64
      - name: Publish public verification material with artifact
        run: cp "$RUNNER_TEMP/linux-release-verification-key.pem" build/apps/desktop/distribution/linux-arm64/
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: licoup-linux-arm64
          path: |
            build/apps/desktop/distribution/linux-arm64/LicoUp-linux-arm64.tar.gz
            build/apps/desktop/distribution/linux-arm64/LicoUp-linux-arm64.tar.gz.sha256
            build/apps/desktop/distribution/linux-arm64/LicoUp-linux-arm64.tar.gz.sig
            build/apps/desktop/distribution/linux-arm64/linux-release-verification-key.pem
          if-no-files-found: error

  build-android-arm64:
    name: Build Android ARM64
    if: ${{ inputs.target == 'android-arm64' }}
    needs: preflight
    runs-on: [self-hosted, macOS, ARM64, lico-release, android]
    env:
      JAVA_HOME: /Applications/Android Studio.app/Contents/jbr/Contents/Home
      LICO_CLIENT_RELEASE_TARGETS: android-arm64
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@42520bdb3cb59f71dae6f8557f7056cf3a46c898 # 1.91.0
        with:
          targets: aarch64-linux-android
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.44.2"
          cache: true
      - run: npm ci
      - name: Build same-source macOS relay CLI prerequisite
        run: npm run client:build:macos
      - name: Install pinned Android NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;30.0.14904198" < /dev/null
          test -d "$ANDROID_HOME/ndk/30.0.14904198"
      - name: Prepare ephemeral Android install key
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/lico-github-artifact.jks" -storepass github-artifact -keypass github-artifact -alias github-artifact -keyalg RSA -keysize 3072 -validity 30 -dname "CN=LicoUp GitHub Artifact Validation"
          chmod 600 "$RUNNER_TEMP/lico-github-artifact.jks"
          keytool -exportcert -rfc -keystore "$RUNNER_TEMP/lico-github-artifact.jks" -storepass github-artifact -alias github-artifact -file "$RUNNER_TEMP/lico-github-artifact.pem"
      - name: Build signed Android ARM64 release
        env:
          LICO_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/lico-github-artifact.jks
          LICO_ANDROID_KEYSTORE_PASSWORD: github-artifact
          LICO_ANDROID_KEY_ALIAS: github-artifact
          LICO_ANDROID_KEY_PASSWORD: github-artifact
          LICO_ANDROID_TARGET_PLATFORM: android-arm64
        run: npm run client:build:android
      - name: Apply remote release validity strategy
        run: npm run client:release:remote-strategy -- --expect build-success
      - name: Publish public verification material with artifact
        run: |
          cp "$RUNNER_TEMP/lico-github-artifact.pem" build/apps/desktop/android/release/
          cp build/apps/desktop/android/release/app-release.apk build/apps/desktop/android/release/LicoUp-android-arm64.apk
          cd build/apps/desktop/android/release
          shasum -a 256 LicoUp-android-arm64.apk > LicoUp-android-arm64.apk.sha256
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: licoup-android-arm64
          path: |
            build/apps/desktop/android/release/LicoUp-android-arm64.apk
            build/apps/desktop/android/release/LicoUp-android-arm64.apk.sha256
            build/apps/desktop/android/release/lico-github-artifact.pem
          if-no-files-found: error

  publish-macos:
    name: Append macOS ARM64
    if: ${{ inputs.target == 'macos-arm64' }}
    needs: [preflight, build-macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: client-github-release-publish-${{ inputs.release_tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: licoup-macos
          path: build/release-incoming
      - name: Append target and verify merged Release
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: node tools/scripts/client-github-release-publish.mjs --tag "${{ inputs.release_tag }}" --target "${{ inputs.target }}" --incoming build/release-incoming --assets build/release-assets --publish "$PUBLISH_RELEASE"

  publish-linux-arm64:
    name: Append Linux glibc ARM64
    if: ${{ inputs.target == 'linux-glibc-arm64' }}
    needs: [preflight, build-linux-arm64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: client-github-release-publish-${{ inputs.release_tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: licoup-linux-arm64
          path: build/release-incoming
      - name: Append target and verify merged Release
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: node tools/scripts/client-github-release-publish.mjs --tag "${{ inputs.release_tag }}" --target "${{ inputs.target }}" --incoming build/release-incoming --assets build/release-assets --publish "$PUBLISH_RELEASE"

  publish-android-arm64:
    name: Append Android ARM64
    if: ${{ inputs.target == 'android-arm64' }}
    needs: [preflight, build-android-arm64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: client-github-release-publish-${{ inputs.release_tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: licoup-android-arm64
          path: build/release-incoming
      - name: Append target and verify merged Release
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: node tools/scripts/client-github-release-publish.mjs --tag "${{ inputs.release_tag }}" --target "${{ inputs.target }}" --incoming build/release-incoming --assets build/release-assets --publish "$PUBLISH_RELEASE"
