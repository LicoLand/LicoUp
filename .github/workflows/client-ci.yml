name: Client CI

on:
  pull_request:
    branches:
      - nightly

permissions:
  contents: read

concurrency:
  group: client-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan client gates
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      readme_fast: ${{ steps.readme.outputs.readme_fast }}
      source: ${{ steps.plan.outputs.source }}
      flutter: ${{ steps.plan.outputs.flutter }}
      rust: ${{ steps.plan.outputs.rust }}
      android: ${{ steps.plan.outputs.android }}
      dependencies: ${{ steps.plan.outputs.dependencies }}
      changed_count: ${{ steps.plan.outputs.changed_count }}
      change_digest: ${{ steps.plan.outputs.change_digest }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Select the author README fast path
        id: readme
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tools/scripts/readme-fast-path.mjs classify --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Verify client gate topology
        if: steps.readme.outputs.readme_fast != 'true'
        run: npm run client:gate:topology
      - name: Select independent gates from changed paths
        id: plan
        if: steps.readme.outputs.readme_fast != 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.sha }}
        run: npm run client:gate:plan -- --base "$BASE_SHA" --head "$HEAD_SHA"

  source:
    name: Client source policy
    if: ${{ needs.plan.outputs.readme_fast != 'true' }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Run Node-only source policy
        env:
          LICO_AUDITOR_GATE_DELEGATED: "1"
        run: npm run client:gate:source
      - name: Upload source-policy reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: client-source-policy-reports
          path: |
            build/reports/
            build/test-reports/
          if-no-files-found: ignore
          retention-days: 14

  flutter:
    name: Flutter checks
    if: ${{ needs.plan.outputs.flutter == 'true' }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.44.2"
          cache: true
      - run: npm ci
      - run: npm run client:gate:flutter

  rust:
    name: Rust checks
    if: ${{ needs.plan.outputs.rust == 'true' }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@42520bdb3cb59f71dae6f8557f7056cf3a46c898 # 1.91.0
        with:
          components: clippy, rustfmt
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/crates/licoup-native/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Install Linux native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libdbus-1-dev pkg-config
      - run: npm ci
      - run: npm run client:gate:rust

  android:
    name: Android native checks
    if: ${{ needs.plan.outputs.android == 'true' }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@42520bdb3cb59f71dae6f8557f7056cf3a46c898 # 1.91.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.44.2"
          cache: true
      - name: Install Android and native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libdbus-1-dev pkg-config
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-33" \
            "ndk;27.0.12077973" \
            "ndk;30.0.14904198" < /dev/null
      - run: npm ci
      - run: npm run client:gate:android
      - name: Upload Android reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: client-android-reports
          path: build/reports/
          if-no-files-found: ignore
          retention-days: 14

  dependencies:
    name: Dependency audit
    if: ${{ needs.plan.outputs.dependencies == 'true' }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@42520bdb3cb59f71dae6f8557f7056cf3a46c898 # 1.91.0
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-audit-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-audit-
      - run: npm ci
      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - run: npm run client:gate:dependencies

  client-required:
    name: Client required
    if: always()
    needs: [plan, source, flutter, rust, android, dependencies]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      PLAN_RESULT: ${{ needs.plan.result }}
      README_FAST_SELECTED: ${{ needs.plan.outputs.readme_fast }}
      SOURCE_RESULT: ${{ needs.source.result }}
      FLUTTER_RESULT: ${{ needs.flutter.result }}
      RUST_RESULT: ${{ needs.rust.result }}
      ANDROID_RESULT: ${{ needs.android.result }}
      DEPENDENCIES_RESULT: ${{ needs.dependencies.result }}
    steps:
      - name: Reduce independent gate results
        run: |
          if [[ "$PLAN_RESULT" != "success" ]]; then
            echo "Client gate planning did not succeed" >&2
            exit 1
          fi
          if [[ "$README_FAST_SELECTED" == "true" ]]; then
            for result in \
              "$SOURCE_RESULT" \
              "$FLUTTER_RESULT" \
              "$RUST_RESULT" \
              "$ANDROID_RESULT" \
              "$DEPENDENCIES_RESULT"
            do
              if [[ "$result" != "skipped" ]]; then
                echo "An ordinary client gate ran for an author README update" >&2
                exit 1
              fi
            done
            exit 0
          fi
          if [[ "$README_FAST_SELECTED" != "false" ]]; then
            echo "README path selection was ambiguous" >&2
            exit 1
          fi
          if [[ "$SOURCE_RESULT" != "success" ]]; then
            echo "Required source policy did not succeed" >&2
            exit 1
          fi
          for result in \
            "$FLUTTER_RESULT" \
            "$RUST_RESULT" \
            "$ANDROID_RESULT" \
            "$DEPENDENCIES_RESULT"
          do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "A selected client gate did not succeed" >&2
              exit 1
            fi
          done
