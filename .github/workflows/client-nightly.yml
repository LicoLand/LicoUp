name: Nightly client

on:
  push:
    branches: [nightly]

permissions:
  contents: read

concurrency:
  group: nightly-client-${{ github.sha }}
  cancel-in-progress: true

jobs:
  validate-nightly:
    name: Validate Nightly client
    runs-on: macos-15
    timeout-minutes: 60
    env:
      LICO_CLIENT_RELEASE_TRACK: nightly
      LICO_CLIENT_RELEASE_TARGETS: macos-arm64
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@249970729cb0ef3589644ae2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@42520bdb3cb59f71dae6f8557f7056cf3a46c898 # 1.91.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.44.2"
          cache: true
      - run: npm ci
      - working-directory: apps/desktop
        run: flutter pub get --enforce-lockfile
      - run: npm run client:version:check
      - run: npm run client:verify:update-manifest:self-test
      - run: npm run client:build -- --platform macos
