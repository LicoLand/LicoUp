# Minimal differential probe for the distribution closure (V7-U10).
#
# It is its own workspace on purpose: it consumes the product contract crate by
# path and must not become a member of the root workspace, edit the root
# manifests or join the product build. It has no production role.
[workspace]

[package]
name = "licoup-distribution-probe"
version = "0.0.0"
edition = "2024"
rust-version = "1.95.0"
publish = false

[[bin]]
name = "licoup-distribution-probe"
path = "src/main.rs"

[dependencies]
licoup-extension-contracts = { path = "../../../../crates/licoup-extension-contracts" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
